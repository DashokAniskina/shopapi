{% extends 'store/base.html' %}
{% block content %}
<h1>Заказ #{{ order_id }}</h1>
<p>Сумма: <b>{{ order.3 }}</b></p>
<h4>Позиции</h4>
<table class="table">
  <thead><tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr></thead>
  <tbody>
  {% for it in items %}<tr><td>{{ it.1 }}</td><td>{{ it.2 }}</td><td>{{ it.3 }}</td><td>{{ it.4 }}</td></tr>
  {% empty %}<tr><td colspan="4">Позиций нет</td></tr>{% endfor %}
  </tbody>
</table>
<h4>Добавить позицию</h4>
<form method="post" action="{% url 'order_add_item' order_id %}">{% csrf_token %}
  <div class="row">
    <div class="col-md-6">
      <label>Товар</label>
      <select class="form-select" name="product_id" required>
        <option value="" disabled selected>-- Выберите товар --</option>
        {% for p in products %}
          <option value="{{ p.0 }}">{{ p.1 }} (остаток: {{ p.2 }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label>Количество</label>
      <input class="form-control" type="number" name="quantity" min="1" required>
    </div>
    <div class="col-md-2 d-flex align-items-end">
      <button class="btn btn-primary w-100">Добавить</button>
    </div>
  </div>
</form>
{% endblock %}
