<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}ShopAPI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">ShopAPI</a>
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="{% url 'products_list' %}">Товары</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'order_create' %}">Заказ</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'category_stats' %}">Статистика</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'discount' %}">Скидка</a></li>
    </ul>
  </div>
</nav>
<div class="container mt-4">
  {% for m in messages %}<div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
