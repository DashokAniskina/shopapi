{% extends 'store/base.html' %}
{% block content %}
<h1>Добавить товар</h1>
<form method="post">{% csrf_token %}
  <div class="mb-3"><label>Название</label><input class="form-control" name="name" required></div>
  <div class="mb-3"><label>Категория</label>
    <select class="form-select" name="category_id" required>
      {% for c in categories %}<option value="{{ c.0 }}">{{ c.1 }}</option>{% endfor %}
    </select></div>
  <div class="mb-3"><label>Цена</label><input class="form-control" type="number" step="0.01" name="price" required></div>
  <div class="mb-3"><label>Остаток</label><input class="form-control" type="number" name="stock" required></div>
  <button class="btn btn-success">Сохранить</button>
</form>
{% endblock %}
